<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <!--
      GitHub Pages has no server-side router, so a direct visit or hard
      refresh on a deep link (e.g. /rajendra-portfolio/blog/my-post) hits
      this 404 page instead of index.html. This encodes the intended path
      into a query string and redirects to index.html, where the inline
      script there decodes it and restores the real URL via
      history.replaceState before React Router mounts and reads it.
      Standard pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // Number of path segments in the site's base path (/rajendra-portfolio/ = 1).
      // Update this if vite.config.ts's `base` ever changes depth.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
