<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!--
      apple-touch-icon and the icons in site.webmanifest are flat PNGs
      rasterized from favicon.svg (iOS/Android home-screen icons don't
      support SVG) — regenerate them with the sharp snippet in README.md's
      "Icons" section if favicon.svg ever changes.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1a17" />

    <!--
      Fonts are loaded here (preconnect + stylesheet link) rather than via a
      CSS @import in index.css — @import is render-blocking and adds an
      extra round-trip before the browser even discovers the font request,
      since it can't be found until the CSS itself is parsed. Loading it
      from HTML lets the browser discover and start fetching it immediately,
      in parallel with everything else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <meta
      name="description"
      content="Rajendra Dharanikota — Strategic Data Analyst specializing in revenue analytics, pricing strategy, and executive reporting."
    />

    <!--
      SEO note: this is a client-rendered React app, so this static HTML
      (title/description/OG/Twitter/JSON-LD) is what search engines, link
      unfurlers (LinkedIn, Slack, iMessage), and crawlers that don't execute
      JS will see first — keep it accurate even though App.tsx also sets
      document.title at runtime. Update these alongside profile.name /
      profile.role in src/data/content.ts if either ever changes, and swap
      /og-image.jpg (currently the headshot) for a designed 1200×630 banner
      if you want a richer link-preview card later.
    -->
    <link rel="canonical" href="https://rajendrakamal.github.io/rajendra-portfolio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rajendrakamal.github.io/rajendra-portfolio/" />
    <meta
      property="og:title"
      content="Rajendra Dharanikota — Strategic Data Analyst"
    />
    <meta
      property="og:description"
      content="Revenue analytics, pricing strategy, and executive reporting — selected projects and experience."
    />
    <meta property="og:image" content="https://rajendrakamal.github.io/rajendra-portfolio/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rajendra Dharanikota — Strategic Data Analyst" />
    <meta
      name="twitter:description"
      content="Revenue analytics, pricing strategy, and executive reporting — selected projects and experience."
    />
    <meta name="twitter:image" content="https://rajendrakamal.github.io/rajendra-portfolio/og-image.jpg" />

    <!--
      Kept in sync with `profile.name`/`profile.role` in src/data/content.ts —
      this file is static HTML so it can't read that file directly, but
      App.tsx also sets document.title at runtime from the same source.
    -->
    <title>Rajendra Dharanikota — Strategic Data Analyst</title>

    <!--
      JSON-LD structured data (schema.org Person) — helps Google associate
      this page with the person/role/employer, and is what a knowledge-panel
      or rich-result pull from. Keep in sync with content.ts: profile.name,
      profile.role, socialLinks.linkedin, experience[0].company (current
      employer), and education[0].school.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rajendra Dharanikota",
        "jobTitle": "Strategic Data Analyst",
        "url": "https://rajendrakamal.github.io/rajendra-portfolio/",
        "image": "https://rajendrakamal.github.io/rajendra-portfolio/og-image.jpg",
        "worksFor": {
          "@type": "Organization",
          "name": "CARFAX Inc."
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Western Ontario"
        },
        "sameAs": [
          "https://www.linkedin.com/in/rajendra-dharanikota-m-eng-865389171/"
        ]
      }
    </script>

    <!-- Applies the saved theme before React mounts, avoiding a light/dark flash. -->
    <script>
      (function () {
        var stored = localStorage.getItem("portfolio-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      GoatCounter — privacy-friendly analytics (no cookies, no consent
      banner needed). Pageviews are tracked automatically by this script;
      custom events (resume downloads, contact form submits, phone reveals,
      project link clicks) are sent from src/lib/analytics.ts. GoatCounter
      skips counting requests from localhost by default, so local dev
      doesn't pollute the dashboard. Dashboard:
      https://rajendradharanikota.goatcounter.com
    -->
    <script
      data-goatcounter="https://rajendradharanikota.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
  </body>
</html>
